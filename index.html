<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Engine</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#333333">
    <meta name="mobile-web-app-capable" content="yes">
</head>

<body>

<div class="container">

    <header>
        <h1>Study Engine</h1>
        <p>Your personal "What should I study?" system.</p>
    </header>


    <!-- ============================= -->
    <!-- WHAT SHOULD I STUDY -->
    <!-- ============================= -->

    <section class="card hero">

        <h2>What should I study?</h2>

        <div class="session-buttons">

            <button onclick="getRecommendation('primary')">
                Primary
            </button>

            <button onclick="getRecommendation('secondary')">
                Secondary
            </button>

            <button onclick="getRecommendation('tertiary')">
                Tertiary
            </button>

        </div>

        <div
            id="recommendation"
            class="recommendation hidden">
        </div>

    </section>


    <!-- ============================= -->
    <!-- WHAT SHOULD I TEST -->
    <!-- ============================= -->

    <section class="card hero">

        <h2>What should I test?</h2>

        <button onclick="getTestRecommendation()">
            Recommend a Test
        </button>

        <div
            id="testRecommendation"
            class="recommendation hidden">
        </div>

    </section>


    <!-- ============================= -->
    <!-- ADD SUBJECT -->
    <!-- ============================= -->

    <section class="card">

        <h2>Add Subject</h2>

        <div class="form-row">

            <input
                id="subjectName"
                type="text"
                placeholder="Subject name">

            <button onclick="addSubject()">
                Add
            </button>

        </div>

        <div id="subjectsList"></div>

    </section>


    <!-- ============================= -->
    <!-- ADD CHAPTER -->
    <!-- ============================= -->

    <section class="card">

        <h2>Add Chapter</h2>

        <select id="chapterSubject"></select>

        <input
            id="chapterName"
            type="text"
            placeholder="Chapter name">

        <select id="chapterStrength">

            <option value="0">
                Not Started
            </option>

            <option value="1">
                Very Weak
            </option>

            <option value="2">
                Weak
            </option>

            <option value="3" selected>
                Okay
            </option>

            <option value="4">
                Strong
            </option>

            <option value="5">
                Mastered
            </option>

        </select>

        <button onclick="addChapter()">
            Add Chapter
        </button>

        <div id="chaptersList"></div>

    </section>


    <!-- ============================= -->
    <!-- ADD / RECORD TEST -->
    <!-- ============================= -->

  <!-- HOME TEST -->
<section class="card">
    <h2>📝 Home Test</h2>
    <p class="small">Record a test you took and scored yourself.</p>

    <select id="testSubject"></select>

    <select id="testChapter"></select>

    <label>Test date</label>
    <input id="testDate" type="date">

    <label>Score (optional)</label>
    <input
        id="testScore"
        type="number"
        min="0"
        max="100"
        placeholder="e.g. 78"
    >

    <label>Mistakes</label>
    <input
        id="testMistakes"
        type="number"
        min="0"
        placeholder="Number of mistakes"
    >

    <button onclick="addTest()">
        Save Home Test
    </button>

    <div id="testsList"></div>
</section>


<!-- SCHOOL TEST -->
<section class="card">
    <h2>📅 Upcoming School Test</h2>
    <p class="small">Add a test/exam that is coming up at school.</p>

    <input
        id="upcomingTestName"
        type="text"
        placeholder="Test name (e.g. Maths Unit Test)"
    >

    <label>Test date</label>
    <input id="upcomingTestDate" type="date">

    <label>Subject</label>
    <select id="upcomingTestSubject"></select>

    <label>Chapters included</label>
    <div id="upcomingChapterList"></div>

    <button onclick="addUpcomingTest()">
        Save School Test
    </button>

    <div id="upcomingTestsList"></div>
</section>
<button id="syncMistakeDB">
    Sync with Mistake DB
</button>
    <!-- ============================= -->
    <!-- LOG STUDY -->
    <!-- ============================= -->

    <section class="card">

        <h2>Log Study Session</h2>

        <select id="studySubject"></select>

        <select id="studyChapter"></select>

        <input
            id="studyDuration"
            type="number"
            placeholder="Duration in minutes">

        <select id="studySession">

            <option value="primary">
                Primary
            </option>

            <option value="secondary">
                Secondary
            </option>

            <option value="tertiary">
                Tertiary
            </option>

        </select>

        <button onclick="logStudy()">
            Save Study Session
        </button>

        <div id="historyList"></div>

    </section>

</div>


<script type="module" src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register("./sw.js");

}
</script>

</body>
</html>
